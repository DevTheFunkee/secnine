# Registro di localizzazione IT/UE.
#
# Una riga per ogni skill del prodotto, pubblica o privata, generata in origine dalla mappa
# `mappa-skill-eu-it` (2026-10-03) e da allora mantenuta a mano. `scripts/check-localization.py`
# la confronta con l'albero a ogni push: vedi docs/LOCALIZZAZIONE.md per il significato dei campi.
#
#   stato      universale | da-localizzare | localizzata | da-creare | nuova
#   livello    core (repo pubblico) | pro (pacchetto privato, mai in questo repo)
#   pacchetto  solo per pro: fisco | lavoro | appalti — diventa il prefisso della skill (`fisco:iva`)
#   revisione  data dell'ultima verifica normativa (solo localizzata/nuova)
#   validita_giorni  oltre questa età la revisione è scaduta: avviso a ogni push, errore nel
#              controllo settimanale

